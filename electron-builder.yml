appId: com.deepseek.harness
productName: DeepSeek Harness
copyright: Copyright DeepSeek
directories:
  output: release
  buildResources: build

files:
  - src/**/*
  - node_modules/**/*
  - package.json
  - "!node_modules/.cache/**"

asar: true
nodeGypRebuild: false
npmRebuild: false
nativeRebuilder: null
asarUnpack:
  # dsh dynamically imports plugins and creates profile fallback symlinks.
  # Keep its complete dependency closure on the real filesystem.
  - node_modules/**/*

extraResources:
  - from: dsh-bundle.tar.gz
    to: dsh-bundle.tar.gz
  - from: dsh-bundle.version
    to: dsh-bundle.version
  - from: dsh-bundle.manifest.json
    to: dsh-bundle.manifest.json

publish:
  provider: github
  owner: vinnyxiong
  repo: deepseek-harness-desktop

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  artifactName: DeepSeek-Harness-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  target:
    - dmg
    - zip

win:
  icon: build/icon.ico
  target:
    - nsis
    - portable

linux:
  icon: build/icon-512.png
  category: Development
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  allowChangeInstallationDirectory: true
