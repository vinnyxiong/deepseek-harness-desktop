appId: com.deepseek.harness
productName: DeepSeek Harness
copyright: Copyright DeepSeek
directories:
  output: release-lite
  buildResources: build

files:
  - src/**/*
  - package.json
  # Lite build: only bundle ws (the sole non-DSH runtime dependency).
  # @deepseek-ai packages are auto-installed on first launch via npm.
  - node_modules/ws/**/*

asar: true
# No asarUnpack needed for @deepseek-ai packages since they are excluded.

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  artifactName: DeepSeek-Harness-Lite-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  target:
    - dmg
    - zip

win:
  icon: build/icon.ico
  artifactName: DeepSeek-Harness-Lite-${version}-win-${arch}.${ext}
  target:
    - nsis
    - portable

linux:
  icon: build/icon-512.png
  category: Development
  artifactName: DeepSeek-Harness-Lite-${version}-linux-${arch}.${ext}
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true