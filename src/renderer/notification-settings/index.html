<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>通知设置</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <main>
    <h1 id="title">通知设置</h1>
    <p id="description">配置任务完成时的系统通知。</p>
    <section id="warning" hidden></section>
    <form id="form">
      <label><input id="enabled" type="checkbox"><span id="label-enabled">启用任务通知</span></label>
      <label><input id="agent" type="checkbox"><span id="label-agent">Agent 完成</span></label>
      <fieldset>
        <legend id="label-jobs">后台任务</legend>
        <label><input id="completed" type="checkbox"><span id="label-completed">成功</span></label>
        <label><input id="failed" type="checkbox"><span id="label-failed">失败</span></label>
        <label><input id="killed" type="checkbox"><span id="label-killed">被终止</span></label>
      </fieldset>
      <label><input id="unfocused" type="checkbox"><span id="label-unfocused">仅在 App 未聚焦时通知</span></label>
      <label><input id="sound" type="checkbox"><span id="label-sound">播放声音</span></label>
      <label><input id="focus" type="checkbox"><span id="label-focus">点击通知后显示 App</span></label>
      <div class="actions">
        <button id="save" type="submit">保存</button>
        <button id="test" type="button">发送测试通知</button>
        <button id="system-settings" type="button">打开系统通知设置</button>
      </div>
      <p id="status" aria-live="polite"></p>
      <p id="diagnostic"></p>
    </form>
  </main>
  <script src="./index.js"></script>
</body>
</html>
