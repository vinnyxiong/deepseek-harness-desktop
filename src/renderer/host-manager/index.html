<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
  <title>DeepSeek Harness</title>
  <link rel="stylesheet" href="./index.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h2>Hosts</h2>
        <button id="add-host-btn" class="icon-btn" title="添加 Host">+</button>
      </div>
      <ul id="host-list" class="host-list" role="listbox"></ul>
    </aside>

    <!-- Drag handle -->
    <div id="drag-handle" aria-hidden="true"></div>

    <!-- Main area -->
    <main id="main">
      <!-- Status bar -->
      <div id="status-bar" class="status-bar" aria-live="polite">
        <span id="status-text">选择一个 Host</span>
        <span id="status-endpoint" class="status-endpoint" hidden></span>
        <div class="status-actions">
          <button id="connect-btn" class="primary" hidden>连接</button>
          <button id="disconnect-btn" hidden>断开</button>
          <button id="retry-btn" hidden>重试</button>
          <button id="update-btn" class="warning" hidden>更新远程 DSH</button>
          <button id="config-btn" title="编辑配置">⚙</button>
        </div>
      </div>

      <!-- Progress bar -->
      <div id="progress-bar" class="install-progress" aria-live="polite" hidden>
        <div class="install-progress-inner">
          <span class="install-spinner" aria-hidden="true"></span>
          <span id="progress-bar-text">正在处理...</span>
        </div>
      </div>

      <!-- Webview container -->
      <div id="webview-container">
        <div id="webview-placeholder" class="webview-placeholder">
          <div class="empty-icon" aria-hidden="true">DSH</div>
          <h3>选择一个 Host</h3>
          <p>从左侧列表选择一个 Host 并连接</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Config Dialog -->
  <dialog id="config-dialog">
    <div class="dialog-content">
      <h3>编辑 Host 配置</h3>
      <div class="config-form">
        <div class="fields" style="margin-bottom: 10px;">
          <label><span>图标</span><div class="icon-picker-row"><span id="cfg-icon" class="cfg-icon-display">🖥️</span><button id="cfg-icon-btn" class="small">更换</button></div></label>
          <label><span>名称</span><input id="cfg-name" type="text" maxlength="64" placeholder="我的服务器"></label>
        </div>
        <div id="cfg-ssh" class="fields grid" hidden>
          <label><span>主机</span><input id="cfg-host" type="text" maxlength="253" placeholder="10.0.0.1"></label>
          <label><span>用户</span><input id="cfg-username" type="text" maxlength="64" placeholder="root"></label>
          <label><span>SSH 端口</span><input id="cfg-ssh-port" type="number" min="1" max="65535" value="22"></label>
          <label><span>私钥路径 <em>可选</em></span><input id="cfg-identity-file" type="text" placeholder="/Users/name/.ssh/id_ed25519"></label>
        </div>
        <div id="cfg-ssh-policy" class="fields" hidden>
          <label><span>主机密钥验证</span><select id="cfg-host-key-policy"><option value="accept-new">首次自动接受</option><option value="strict">仅已知主机</option></select></label>
        </div>
        <div id="cfg-startup" class="checkbox-list" hidden>
          <label class="checkbox-label"><input id="cfg-auto-start" type="checkbox" checked><span><strong>连接时自动启动远程 DSH</strong></span></label>
          <label class="checkbox-label"><input id="cfg-auto-stop" type="checkbox" checked><span><strong>断开时自动停止远程 DSH</strong></span></label>
          <label class="checkbox-label"><input id="cfg-auto-install" type="checkbox" checked><span><strong>自动传输远程 DSH</strong></span></label>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="save-config-btn" class="primary">保存</button>
        <button id="delete-config-btn" class="danger">删除 Host</button>
        <button id="cancel-config-btn">取消</button>
      </div>
    </div>
  </dialog>

  <!-- Add Host Dialog -->
  <dialog id="add-dialog">
    <div class="dialog-content">
      <h3>添加 Host</h3>
      <div class="dialog-options">
        <button class="add-option" data-type="local">
          <span class="add-option-icon local-icon" aria-hidden="true"></span>
          <span><strong>本机</strong><small>在本地启动 DSH</small></span>
        </button>
        <button class="add-option" data-type="remote">
          <span class="add-option-icon remote-icon" aria-hidden="true"></span>
          <span><strong>远程服务器</strong><small>通过 SSH 连接远程 DSH</small></span>
        </button>
      </div>
      <div class="dialog-actions">
        <button id="cancel-add-btn">取消</button>
      </div>
    </div>
  </dialog>

  <script src="./index.js"></script>
</body>
</html>
